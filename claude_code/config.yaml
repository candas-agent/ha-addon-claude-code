name: Claude Code
version: "0.1.8"
slug: claude_code
description: Sandboxed Claude Code — talks to Home Assistant through its API only, with no access to Home Assistant files
url: https://github.com/candas-agent/ha-addon-claude-code
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Lets the Supervisor watchdog check the web terminal and restart the add-on if it stops answering.
watchdog: "tcp://[HOST]:[PORT:7681]"
ingress: true
ingress_port: 7681
panel_icon: mdi:robot-outline
panel_title: Claude Code
panel_admin: true
# Deliberately NO "map:" entry: the container cannot see /config, /share, /backup or other add-ons.
# Deliberately no homeassistant_api / hassio_api: only the token given in the options grants API access.
# Optional fields (ha_port, github_token, git_name, git_email) are only in the schema, so they can stay empty.
options:
  ha_token: ""
  repos: []
  remote_control: false
schema:
  ha_port: port?
  ha_token: password
  github_token: password?
  git_name: str?
  git_email: str?
  repos:
    - str
  remote_control: bool
