configuration:
  ha_url:
    name: Home Assistant URL
    description: Address used by the ha-api helper. The default reaches Home Assistant from inside the add-on network; use your LAN address if you changed the HTTP port (e.g. http://192.168.1.10).
  ha_token:
    name: Home Assistant token
    description: Long-lived access token (Profile → Security). Also copied to <repo>/.ha_token for scripts.
  github_token:
    name: GitHub token
    description: Fine-grained token limited to your working repositories (Contents read/write). Optional.
  git_name:
    name: git user name
  git_email:
    name: git e-mail
  repos:
    name: Working repositories
    description: List of owner/name repositories, cloned into /data/projects on start.
  remote_control:
    name: Remote Control
    description: Run "claude remote-control" on start, to drive the session from the Claude apps.
