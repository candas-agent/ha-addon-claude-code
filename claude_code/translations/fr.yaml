configuration:
  ha_url:
    name: Adresse de Home Assistant
    description: Adresse utilisée par la commande ha-api. La valeur par défaut fonctionne depuis le module ; mettez l'adresse locale si vous avez changé le port HTTP (ex. http://192.168.1.10).
  ha_token:
    name: Jeton Home Assistant
    description: Jeton d'accès longue durée (Profil → Sécurité). Aussi copié dans <dépôt>/.ha_token pour les scripts.
  github_token:
    name: Jeton GitHub
    description: Jeton « fine-grained » limité aux dépôts de travail (Contents en lecture/écriture). Facultatif.
  git_name:
    name: Nom pour git
  git_email:
    name: E-mail pour git
  repos:
    name: Dépôts de travail
    description: Liste au format propriétaire/nom, clonés dans /data/projects au démarrage.
  remote_control:
    name: Remote Control
    description: Lance « claude remote-control » au démarrage, pour piloter la session depuis l'appli Claude.
